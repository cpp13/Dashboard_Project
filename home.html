<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sedan+SC&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://kit.fontawesome.com/efc246ce45.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <main>
      <section class="left">
        <div class="nav_card">
          <div class="profile">
            <div class="user_photo">
              <img
                src="./styles/man.jpg"
                alt="user photo"
                width="120px"
                height="120px"
              />
            </div>
            <div class="user_name">John Doe</div>
          </div>
          <div class="navbar">
            <div class="nav">
              <i class="fa-solid fa-list"></i>
              <a href="#board">Dashboard</a>
            </div>
            <div class="nav">
              <i class="fa-solid fa-tags"></i>
              <a href="#data">Data</a>
            </div>
            <div class="nav">
              <i class="fa-solid fa-user"></i>
              <a href="#user">Users</a>
            </div>
            <div class="nav">
              <i class="fa-solid fa-calendar-days"></i>
              <a href="#schedule">Schedule</a>
            </div>
            <div class="nav">
              <i class="fa-solid fa-gear"></i>
              <a href="#contact">Contact</a>
            </div>
          </div>
        </div>
      </section>
      <section class="right">
        <header>
          <h1>Dashboard</h1>
          <input
            type="search"
            id="searchbar"
            name="searchbar"
            placeholder="search..."
          />
        </header>
        <div id="board">
          <div class="act">
            <h3>Activities</h3>
            <p>MAY-JUNE-2024</p>
          </div>
          <div class="graph">
            <img src="./styles/BarGraph.png" alt="bar graph" />
          </div>
        </div>
        <div id="data">
          <h2>Dashboard Data</h2>
          <div id="card_con">
            <div class="revenue card">
              <i class="fa-solid fa-dollar-sign"></i>
              <p class="cardHead">Total Revenue</p>
              <p class="cardData">$456.553.563</p>
            </div>
            <div class="transaction card">
              <i class="fa-solid fa-tag"></i>
              <p class="cardHead">Total Transaction</p>
              <p class="cardData">1,450</p>
            </div>
            <div class="likes card">
              <i class="fa-solid fa-thumbs-up"></i>
              <p class="cardHead">Total Likes</p>
              <p class="cardData">1,234</p>
            </div>
            <div class="user card">
              <i class="fa-solid fa-user"></i>
              <p class="cardHead">Total User</p>
              <p class="cardData">856</p>
            </div>
          </div>
        </div>
        <div id="users">
          <h2>User Interaction</h2>
        </div>
        <div id="schedule">
            <table>
                <th>Month</th>
                <th>Number of users</th>
                <tr>
                    <td>January</td>
                    <td>1000</td>
                </tr>
                <tr>
                    <td>February</td>
                    <td>1200</td>
                </tr>
                <tr>
                    <td>march</td>
                    <td>1800</td>
                </tr>
                <tr>
                    <td>april</td>
                    <td>1250</td>
                </tr>
                <tr>
                    <td>may</td>
                    <td>1000</td>
                </tr>
            </table>
        </div>
        <div id="contact"></div>
        <footer></footer>
      </section>
    </main>
  </body>
</html>
