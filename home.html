<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sedan+SC&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section class="left">
        <div class="nav_card">
          <div class="profile">
            <div class="user_photo">
              <img
                src="./styles/man.jpg"
                alt="user photo"
                width="120px"
                height="120px"
              />
            </div>
            <div class="user_name">John Doe</div>
          </div>
          <div class="nav_opt">
            <div class="nav_icons">
              <div></div>
              <div>Dashboard</div>
            </div>
            <div class="nav_icons">
              <div></div>
              <div>Data</div>
            </div>
            <div class="nav_icons">
              <div></div>
              <div>Users</div>
            </div>
            <div class="nav_icons">
              <div></div>
              <div>Schedule</div>
            </div>
            <div class="nav_icons">
              <div></div>
              <div>Contact</div>
            </div>
          </div>
        </div>
      </section>
      <section class="right"></section>
    </main>
  </body>
</html>
